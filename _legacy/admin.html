<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rahayu Salon</title>

    <!-- FullCalendar CSS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

    <!-- Tailwind CSS (for quick styling) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        #calendar {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .fc-event {
            cursor: pointer;
        }
    </style>
</head>

<body class="p-6">

    <div class="max-w-6xl mx-auto mb-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-800">📅 Rahayu Salon Admin</h1>
        <a href="/" class="text-blue-600 hover:text-blue-800 font-medium">← Kembali ke Website</a>
    </div>

    <div id='calendar'></div>

    <!-- Modal for Event Details -->
    <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl transform transition-all">
            <h2 id="modalTitle" class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">Detail Reservasi</h2>
            <div class="space-y-3">
                <p><strong>👤 Nama:</strong> <span id="modalName"></span></p>
                <p><strong>📞 Telp:</strong> <span id="modalPhone"></span></p>
                <p><strong>💅 Layanan:</strong> <span id="modalService"></span></p>
                <p><strong>⏰ Waktu:</strong> <span id="modalTime"></span></p>
                <p><strong>📝 Catatan:</strong> <span id="modalNotes" class="italic text-gray-600"></span></p>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeModal()"
                    class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-6 rounded-lg transition-colors">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
                },
                locale: 'id',
                events: function (fetchInfo, successCallback, failureCallback) {
                    fetch('http://localhost:5000/api/bookings')
                        .then(response => response.json())
                        .then(data => {
                            const events = data.map(booking => ({
                                title: `${booking.name} (${booking.service})`,
                                start: `${booking.date}T${booking.time}`,
                                extendedProps: {
                                    name: booking.name,
                                    phone: booking.phone,
                                    service: booking.service,
                                    time: booking.time,
                                    notes: booking.notes
                                },
                                color: getColor(booking.service)
                            }));
                            successCallback(events);
                        })
                        .catch(error => {
                            console.error('Error fetching events:', error);
                            failureCallback(error);
                        });
                },
                eventClick: function (info) {
                    showModal(info.event);
                }
            });
            calendar.render();
        });

        function getColor(service) {
            if (service.includes('Nail')) return '#ec4899'; // Pink
            if (service.includes('Massage')) return '#8b5cf6'; // Purple
            if (service.includes('Facial')) return '#10b981'; // Green
            return '#3b82f6'; // Blue default
        }

        function showModal(event) {
            const props = event.extendedProps;
            document.getElementById('modalTitle').innerText = `Reservasi: ${props.service}`;
            document.getElementById('modalName').innerText = props.name;
            document.getElementById('modalPhone').innerText = props.phone;
            document.getElementById('modalService').innerText = props.service;
            document.getElementById('modalTime').innerText = `${event.start.toLocaleDateString('id-ID')} ${props.time}`;
            document.getElementById('modalNotes').innerText = props.notes || '-';

            document.getElementById('eventModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }
    </script>
</body>

</html>
